<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>&lt;Z3RO&gt; No Mercy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style id="app-css">
:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --surface2:#EEF1F5; --ink:#141B2B; --muted:#566176; --line:#DCE1E9;
  --gold:#8A5C00; --gold-fill:#F4B92B; --gold-soft:#FFF2CC;
  --blue:#1F4FD1; --blue-fill:#2F62E8; --blue-soft:#E3EBFF;
  --red:#C42F1D; --red-soft:#FDE4DF;
  --green:#127A43; --green-fill:#157F45; --green-soft:#DBF3E5;
  --amber:#8F5400; --amber-soft:#FFEACB;
  --purple:#5B33B5; --purple-fill:#6D45CF; --purple-soft:#EEE7FF;
  --teal:#0A6463; --teal-fill:#0E7C7B; --teal-soft:#DBF2F1;
  --rose:#A12F59; --rose-fill:#B83A68; --rose-soft:#FCE4EC;
  --hero:#17203A; --on-primary:#FFFFFF;
  --display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1320; --surface:#171E2E; --surface2:#222B3E; --ink:#EEF2F9; --muted:#A3AEC2; --line:#2B354B;
    --gold:#F6C453; --gold-fill:#F4B92B; --gold-soft:#3A2F12;
    --blue:#93B3FF; --blue-fill:#3B6EF0; --blue-soft:#1B2A4A;
    --red:#FF8E7E; --red-soft:#3E1F1A;
    --green:#62D69A; --green-fill:#1B8A4F; --green-soft:#15362A;
    --amber:#FFC56E; --amber-soft:#3A2B10;
    --purple:#C7AEFF; --purple-fill:#7A55DB; --purple-soft:#2B2147;
    --teal:#72D9D5; --teal-fill:#11807E; --teal-soft:#123230;
    --rose:#FF9FC0; --rose-fill:#C2416E; --rose-soft:#3A1A27;
    --hero:#1B2643; --on-primary:#141B2B;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1320; --surface:#171E2E; --surface2:#222B3E; --ink:#EEF2F9; --muted:#A3AEC2; --line:#2B354B;
  --gold:#F6C453; --gold-fill:#F4B92B; --gold-soft:#3A2F12;
  --blue:#93B3FF; --blue-fill:#3B6EF0; --blue-soft:#1B2A4A;
  --red:#FF8E7E; --red-soft:#3E1F1A;
  --green:#62D69A; --green-fill:#1B8A4F; --green-soft:#15362A;
  --amber:#FFC56E; --amber-soft:#3A2B10;
    --purple:#C7AEFF; --purple-fill:#7A55DB; --purple-soft:#2B2147;
    --teal:#72D9D5; --teal-fill:#11807E; --teal-soft:#123230;
    --rose:#FF9FC0; --rose-fill:#C2416E; --rose-soft:#3A1A27;
  --hero:#1B2643; --on-primary:#141B2B;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

.page{max-width:600px;margin:0 auto;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.page.ro{padding-bottom:32px}
.body{padding:0 16px}

/* hero */
.hero{background:var(--hero);color:#fff;border-bottom:3px solid var(--gold-fill);padding:20px 16px 18px;margin-bottom:16px}
@media (min-width:600px){.hero{border-radius:0 0 18px 18px}}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.title{font-family:var(--display);font-weight:400;font-size:clamp(2rem,8.5vw,2.6rem);line-height:1.05;margin:0;word-break:keep-all}
.season{margin:8px 0 0;color:rgba(255,255,255,.8);font-size:.92rem}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:8px;margin-top:16px}
.tile{font:inherit;color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:10px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.tile b{font-family:var(--display);font-weight:400;font-size:2.1rem;line-height:1}
.tile b small{font-family:var(--body);font-size:.85rem;font-weight:500;opacity:.7;margin-left:3px}
.tile span{font-size:.85rem;font-weight:600;opacity:.92}
.tile.tier b{color:var(--th)}
.tile.warn b{color:#FF9F90}

/* status */
.status{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--surface);color:var(--muted);white-space:nowrap;flex:none}
.hero .status{background:rgba(255,255,255,.1);color:rgba(255,255,255,.88)}
.status button{font:inherit;background:none;border:0;color:inherit;text-decoration:underline;cursor:pointer;padding:0 0 0 4px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.saved{background:var(--green-fill)}
.dot.pending,.dot.saving,.dot.conflict{background:var(--gold-fill)}
.dot.error{background:var(--red)}
.dot.local,.dot.ro{background:var(--blue-fill)}

/* top bar for other pages */
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:20px 16px 12px}
.bar h1{font-family:var(--display);font-weight:400;font-size:1.9rem;line-height:1.1;margin:0}

/* common */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:700;font-size:1rem;border-radius:12px;padding:12px 18px;min-height:48px;cursor:pointer;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--on-primary)}
.btn.big{width:100%;min-height:56px;font-size:1.08rem}
.btn.danger{background:var(--red-soft);border-color:transparent;color:var(--red)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg.i{width:20px;height:20px}
.acts{display:flex;gap:8px;margin:0 0 14px}
.acts .btn{flex:1;padding:10px 8px;font-size:.9rem;gap:6px}
.acts .btn svg.i{width:18px;height:18px}
.abs-btn{width:100%;margin:0 0 14px;min-height:52px;font-size:1.02rem}
.toast{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--ink);color:var(--on-primary);padding:12px 14px;border-radius:12px;margin:0 0 14px;font-size:.95rem;font-weight:600}
.toast button{font:inherit;background:none;border:0;color:inherit;opacity:.8;text-decoration:underline;cursor:pointer;flex:none}
.note{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 14px;font-size:.92rem;color:var(--muted)}
.note.demo{border-color:var(--blue-fill);color:var(--ink);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.note.demo .btn{min-height:40px;padding:8px 14px;font-size:.9rem}
.empty{text-align:center;padding:36px 16px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.empty b{display:block;font-size:1.15rem;margin-bottom:6px}
.empty p{margin:0 0 16px;color:var(--muted)}

/* ranking groups */
.grp{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin:0 0 14px;overflow:hidden}
.grp-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0;padding:12px 16px;font-size:1.02rem;font-weight:700}
.grp-n{font-size:.88rem;font-weight:600;opacity:.85}
.grp.tier .grp-h{background:var(--ts);color:var(--tt)}
.grp.tie .grp-h{background:var(--amber-soft);color:var(--amber)}
.grp.rest .grp-h{background:var(--surface2);color:var(--ink)}
.grp.out .grp-h{background:var(--surface2);color:var(--muted)}
.grp.warn .grp-h{background:var(--red-soft);color:var(--red)}
.tie-box{padding:12px 16px;border-bottom:1px solid var(--line);font-size:.93rem}
.tie-box p{margin:0 0 10px}
.list{list-style:none;margin:0;padding:0}
.m+.m{border-top:1px solid var(--line)}
.m-btn{font:inherit;color:inherit;background:none;border:0;width:100%;text-align:left;cursor:pointer;display:grid;grid-template-columns:38px 1fr auto 18px;align-items:center;gap:12px;padding:12px 14px}
.m-btn:focus-visible{outline-offset:-3px}
.rk{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:1.1rem;background:var(--surface2);color:var(--muted)}
.m.tier .rk{background:var(--tf);color:var(--tfo)}
.m-mid{min-width:0}
.m-name{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.nm{font-weight:700;font-size:1.07rem;word-break:break-all}
.chip{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.chip.bad{background:var(--red-soft);color:var(--red)}
.m-rate{display:flex;align-items:center;gap:8px;margin-top:7px}
.rbar{flex:1;max-width:150px;height:8px;border-radius:999px;background:var(--surface2);overflow:hidden}
.rbar i{display:block;height:100%;border-radius:inherit;background:var(--green-fill)}
.rbar.bad i{background:var(--red)}
.pct{font-size:.85rem;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.pct.bad{color:var(--red)}
.m-pts{font-family:var(--display);font-size:1.75rem;line-height:1;white-space:nowrap;font-variant-numeric:tabular-nums}
.m-pts small{font-family:var(--body);font-size:.8rem;font-weight:600;color:var(--muted);margin-left:2px}
.chev{color:var(--muted);display:grid}
.chev svg.i{width:18px;height:18px;transition:transform .2s}
.m-btn[aria-expanded="true"] .chev svg.i{transform:rotate(180deg)}
.m-detail{padding:2px 14px 14px 64px}
.kv{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.88rem;color:var(--muted);margin-bottom:8px}
.kv b{color:var(--ink)}
.hist{list-style:none;margin:0;padding:0;font-size:.9rem}
.hist li{display:grid;grid-template-columns:42px 1fr auto 44px;gap:8px;align-items:center;padding:7px 0;border-top:1px dashed var(--line)}
.hist .d{color:var(--muted);font-variant-numeric:tabular-nums}
.hist .p{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.pill{font-size:.75rem;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill.in{background:var(--green-soft);color:var(--green)}
.pill.ex{background:var(--blue-soft);color:var(--blue)}
.pill.ab{background:var(--red-soft);color:var(--red)}
.pill.na{background:var(--surface2);color:var(--muted)}
.wl li{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:12px 16px}
.wl li+li{border-top:1px solid var(--line)}
.wl .nm{font-size:1rem}
.wl .muted{font-size:.88rem;color:var(--muted)}
.wl b{font-family:var(--display);font-weight:400;font-size:1.35rem;color:var(--red)}

/* record */
.q{font-size:1.4rem;font-weight:700;margin:4px 0 6px;line-height:1.35;word-break:keep-all}
.q-sub{color:var(--muted);margin:0 0 14px;font-size:.95rem}
.q-sub b{color:var(--ink)}
.date-pick{display:flex;align-items:center;gap:10px;margin:8px 0 14px;font-weight:600}
.date-pick .in{width:auto}
.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.type{font:inherit;color:inherit;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:120px}
.type:hover{border-color:var(--ink)}
.type b{font-family:var(--display);font-weight:400;font-size:1.6rem;line-height:1.1}
.type .pts{font-weight:700;color:var(--green)}
.type small{color:var(--muted);font-size:.82rem;margin-top:auto}
.sub-h{display:flex;justify-content:space-between;align-items:baseline;font-size:1.05rem;margin:28px 0 10px}
.sub-h span{font-size:.88rem;font-weight:500;color:var(--muted)}
.evs{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.evs li+li{border-top:1px solid var(--line)}
.ev{font:inherit;color:inherit;background:none;border:0;width:100%;display:grid;grid-template-columns:54px 1fr auto 18px;gap:10px;align-items:center;padding:14px;text-align:left;cursor:pointer}
.ev-date{font-family:var(--display);font-size:1.1rem}
.ev-name{font-weight:700}
.ev-n{font-size:.88rem;color:var(--muted);white-space:nowrap}
.ev .chev svg.i{transform:rotate(-90deg)}

/* wizard */
.wz{max-width:600px;margin:0 auto;padding:0 16px calc(120px + env(safe-area-inset-bottom,0px))}
.wz-head{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:10px;padding:14px 0 10px}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.wz-title b{display:block;font-size:1.05rem}
.wz-title span{font-size:.85rem;color:var(--muted)}
.textbtn{font:inherit;font-weight:600;background:none;border:0;color:var(--muted);cursor:pointer;padding:10px 6px;min-height:44px}
.wz-prog{height:6px;border-radius:999px;background:var(--surface2);overflow:hidden;margin-bottom:20px}
.wz-prog i{display:block;height:100%;background:var(--ink);border-radius:inherit;transition:width .25s}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.pill-btn{font:inherit;font-size:.9rem;font-weight:700;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 16px;cursor:pointer;min-height:42px}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:8px}
.pick{font:inherit;font-size:1rem;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;min-height:56px;padding:8px 10px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;word-break:break-all;text-align:center}
.pick svg.i{width:18px;height:18px;display:none}
.pick[aria-pressed="true"] svg.i{display:block}
.pick.in[aria-pressed="true"]{background:var(--green-fill);border-color:var(--green-fill);color:#fff}
.pick.ex[aria-pressed="true"]{background:var(--blue-fill);border-color:var(--blue-fill);color:#fff}
.pick.na[aria-pressed="true"]{background:var(--muted);border-color:var(--muted);color:var(--surface)}
.na-box{margin-top:20px;padding-top:12px;border-top:1px dashed var(--line)}
.na-box .textbtn{color:var(--blue);padding-left:0}
.pick.bonus[aria-pressed="true"]{background:var(--gold-fill);border-color:var(--gold-fill);color:#2B1E00}
.all-done{background:var(--green-soft);color:var(--green);border-radius:12px;padding:16px;font-weight:700;text-align:center}
.sum{display:flex;flex-direction:column;gap:10px}
.sum-row{border-radius:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--line)}
.sum-row.good{border-left-color:var(--green-fill)}
.sum-row.gold{border-left-color:var(--gold-fill)}
.sum-row.blue{border-left-color:var(--blue-fill)}
.sum-row.gray{border-left-color:var(--muted)}
.sum-row.bad{border-left-color:var(--red)}
.sum-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-weight:700;font-size:1.02rem}
.sum-top span{font-weight:600;color:var(--muted);font-size:.88rem}
.sum-row p{margin:6px 0 0;font-size:.93rem;color:var(--muted);word-break:keep-all}
.wz-foot{position:fixed;left:0;right:0;bottom:0;z-index:15;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
.wz-foot div{max-width:568px;margin:0 auto}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.nav button{font:inherit;font-size:.8rem;font-weight:700;background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 8px;min-height:62px;cursor:pointer;position:relative}
.nav button svg.i{width:24px;height:24px}
.nav button[aria-current="page"]{color:var(--ink)}
.nav button[aria-current="page"]::before{content:"";position:absolute;top:0;left:32%;right:32%;height:3px;border-radius:0 0 3px 3px;background:var(--gold-fill)}

/* manage */
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface2);padding:4px;border-radius:12px;margin:0 16px 16px}
.seg2 button{font:inherit;font-weight:700;border:0;border-radius:9px;padding:10px;background:none;color:var(--muted);cursor:pointer;min-height:44px}
.seg2 button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.card-h{font-size:1.08rem;font-weight:700;margin:0 0 4px}
.card-sub{font-size:.88rem;color:var(--muted);margin:0 0 12px}
.in{font:inherit;font-size:1rem;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);min-height:46px;width:100%}
textarea.in{resize:vertical}
.in:focus{border-color:var(--blue-fill);outline:none}
.in:focus-visible{outline:3px solid var(--blue);outline-offset:1px}
.num{font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:10px}
details.adv summary{cursor:pointer;font-size:.92rem;font-weight:600;color:var(--blue);padding:4px 0}
details.adv .in{margin-top:8px;width:auto}
.mem{padding:12px 0;border-top:1px solid var(--line)}
.mem:first-child{border-top:0;padding-top:0}
.mem .nm-in{background:var(--surface2);border-color:transparent;font-weight:700}
.mem-opts{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin-top:8px}
.mini-f{display:inline-flex;align-items:center;gap:6px;font-size:.88rem;font-weight:600;color:var(--muted)}
.mini-f .in{min-height:38px;padding:4px 8px;width:auto;font-size:.9rem}
.del{font:inherit;font-size:.88rem;font-weight:700;color:var(--red);background:var(--red-soft);border:0;border-radius:8px;padding:6px 12px;min-height:38px;cursor:pointer;margin-left:auto}
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-size:.95rem;font-weight:600;position:relative}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.track{width:44px;height:26px;border-radius:999px;background:var(--line);position:relative;transition:background .2s;flex:none}
.track::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch input:checked + .track{background:var(--green-fill)}
.switch input:checked + .track::after{transform:translateX(18px)}
.switch input:focus-visible + .track{outline:3px solid var(--blue);outline-offset:2px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted);font-weight:600}
.line{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:.98rem;font-weight:500}
.line .in{width:5.5rem}
.line select.in{width:auto}
.tcard{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--surface2)}
.tcard .in{background:var(--surface)}
.tfoot{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-top:12px}
.tip{font-size:.86rem;color:var(--muted);margin:10px 0 0}

/* sheets */
.overlay{position:fixed;inset:0;z-index:40;background:rgba(8,12,20,.6);display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
@media (min-width:600px){.overlay{align-items:center}}
.sheet{background:var(--surface);color:var(--ink);border-radius:18px;width:100%;max-width:600px;max-height:100%;overflow:auto;padding:20px}
.sheet-title{font-family:var(--display);font-weight:400;font-size:1.6rem;margin:0 0 8px}
.sheet p{font-size:.93rem;margin:0}
.sheet ul.rules{margin:4px 0 0;padding-left:1.1rem;font-size:.95rem}
.sheet ul.rules li{margin:6px 0}
.sheet-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:18px}
.ladwrap{overflow-x:auto;margin:14px 0 4px}
.ladder{display:block;margin:0 auto;max-width:none}
.ladder .lv{stroke:var(--muted);stroke-width:2}
.ladder .lp{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;opacity:.92}
.ladder .ln{font:700 13px var(--body)}
.ladder .lb{font:700 13px var(--body);fill:var(--muted)}
.ladder .lb.tier{fill:var(--tt)}
.ladres{list-style:none;padding:0;margin:10px 0 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 14px;font-size:.95rem}
.ladres b.tier{color:var(--tt)}
.ladres b.none{color:var(--muted);font-weight:500}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.copybox{width:100%;min-height:240px;margin-top:10px}

/* notice & account */
.ncard{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--gold-fill);border-radius:14px;padding:14px 16px;margin:0 0 14px}
.ncard-h{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700;margin-bottom:6px}
.ncard-h span{display:inline-flex;align-items:center;gap:6px}
.ncard-h svg.i{width:20px;height:20px;color:var(--gold)}
.ncard p{margin:0;white-space:pre-wrap;word-break:keep-all;font-size:.98rem}
.ncard .textbtn{padding:4px 0;min-height:32px;color:var(--blue)}
.ncard.empty-n{border-left-color:var(--line);color:var(--muted)}
.acct{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px 10px;margin:24px 0 6px;font-size:.88rem;color:var(--muted);text-align:center}
.acct .textbtn{color:var(--blue);padding:6px 4px;min-height:36px}
.acct-card{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;font-size:.92rem}
.notice-in{min-height:180px}
.login-f{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.login-err{color:var(--red);font-size:.9rem;font-weight:600;margin:4px 0 0}

/* absence & image */
.abs-form{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.abs-form .field{font-size:.85rem}
.abs-info{font-size:.88rem;font-weight:600;margin:2px 0 0}
.abs-info.err{color:var(--red)}
.abs-info.ok{color:var(--green)}
.abs-list{list-style:none;margin:8px 0 0;padding:0}
.abs-list li{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.abs-list .a-top{font-weight:700}
.abs-list .a-top span{font-weight:500;color:var(--muted);margin-left:6px}
.abs-list .a-sub{font-size:.82rem;color:var(--muted)}
.abs-h{font-size:1rem;font-weight:700;margin:22px 0 4px}
.cap-img{width:100%;border-radius:10px;border:1px solid var(--line);margin-top:12px;display:block}
.cap{position:fixed;left:-10000px;top:0;width:720px;background:#F4F6FA;color:#141B2B;font-family:var(--body);padding:28px 28px 22px}
.cap-h{background:#17203A;color:#fff;border-bottom:4px solid #F4B92B;border-radius:14px;padding:18px 20px;margin-bottom:16px}
.cap-h b{display:block;font-family:var(--display);font-weight:400;font-size:34px;line-height:1.1}
.cap-h span{display:block;font-size:15px;opacity:.85;margin-top:6px}
.cap-g{border-radius:12px;overflow:hidden;background:#fff;border:1px solid #DCE1E9;margin-bottom:12px}
.cap-gh{display:flex;justify-content:space-between;padding:9px 14px;font-weight:700;font-size:16px}
.cap-r{display:flex;align-items:center;gap:12px;padding:8px 14px;border-top:1px solid #E6EAF0;font-size:16px}
.cap-r i{font-style:normal;width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-family:var(--display);font-size:15px;background:#EEF1F5;color:#566176;flex:none}
.cap-r .n{font-weight:700;flex:1}
.cap-r .rt{color:#566176;font-size:14px}
.cap-r .rt.bad{color:#C42F1D;font-weight:700}
.cap-r .p{font-family:var(--display);font-size:20px;min-width:70px;text-align:right}
.cap-f{font-size:13px;color:#566176;margin-top:10px}

/* random */
.tools-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tool{font:inherit;color:inherit;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:76px}
.tool b{font-size:1.02rem}
.tool span{font-size:.82rem;color:var(--muted)}
.tool[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.rchips{display:flex;flex-wrap:wrap;gap:6px}
.rchip{font:inherit;font-size:.92rem;font-weight:600;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer;min-height:38px}
.rchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--on-primary)}
.rchip.custom{background:var(--blue-soft);border-color:transparent;color:var(--blue)}
.rchip.custom b{margin-left:6px}
.radd{display:flex;gap:8px;margin-top:12px}
.radd .in{flex:1}
.stepper{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.stepper button{font:inherit;font-size:1.1rem;font-weight:700;width:42px;height:42px;border:0;background:var(--surface2);color:var(--ink);cursor:pointer}
.stepper span{min-width:52px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.rule-seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface2);padding:4px;border-radius:12px}
.rule-seg button{font:inherit;font-size:.9rem;font-weight:700;border:0;border-radius:9px;padding:10px 6px;background:none;color:var(--muted);cursor:pointer;min-height:44px}
.rule-seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.dlog li{padding:12px 14px}
.dl-top{display:flex;justify-content:space-between;align-items:baseline;gap:4px 10px;flex-wrap:wrap}
.dl-top span{font-size:.82rem;color:var(--muted)}
.dl-res{font-weight:700;margin-top:4px;word-break:keep-all}
.dl-sub{font-size:.82rem;color:var(--muted);margin-top:2px;word-break:keep-all}
.stage-ov{position:fixed;inset:0;z-index:50;background:rgba(8,12,20,.74);display:flex;align-items:center;justify-content:center;padding:12px;padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.stage{background:var(--surface);color:var(--ink);border-radius:18px;width:100%;max-width:620px;max-height:100%;overflow:auto;padding:16px}
.st-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.st-head b{font-family:var(--display);font-weight:400;font-size:1.55rem;display:block;line-height:1.15}
.st-head span{font-size:.85rem;color:var(--muted)}
.st-official{background:var(--amber-soft);color:var(--amber);font-weight:700;font-size:.88rem;padding:8px 12px;border-radius:10px;margin-bottom:10px}
.st-body{display:flex;flex-direction:column;align-items:center;width:100%}
.st-result{margin-top:14px;background:var(--surface2);border-radius:12px;padding:12px 14px}
.st-result h3{margin:0 0 6px;font-size:.95rem;color:var(--muted)}
.st-result .win{font-family:var(--display);font-size:1.6rem;line-height:1.25;color:var(--gold);word-break:keep-all}
.st-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:14px}
.res-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.lab{display:inline-block;font-size:.8rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.lab.win{background:var(--gold-fill);color:#2B1E00}
.lab.tier{background:var(--tf);color:var(--tfo)}
.spin-picks{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:14px}
.spin-picks .lab{font-size:.9rem;padding:5px 12px;background:var(--surface);border:1.5px solid var(--line);color:var(--ink)}
.spin-picks .lab.win{background:var(--gold-fill);border-color:var(--gold-fill);color:#2B1E00}
.spin-picks .lab.tier{background:var(--tf);border-color:var(--tf);color:var(--tfo)}
.wheel-wrap{position:relative;width:min(320px,80vw);aspect-ratio:1/1;margin-top:10px}
.wheel{width:100%;height:100%;display:block;transform-origin:50% 50%}
.wheel.nt{transition:none}
.wheel-ptr{position:absolute;left:50%;top:-8px;transform:translateX(-50%);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:28px solid var(--ink);z-index:2;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:10px;width:100%}
.card3d{perspective:700px;display:flex;flex-direction:column;align-items:center;gap:5px}
.card-in{position:relative;width:100%;aspect-ratio:3/4;transition:transform .55s;transform-style:preserve-3d;cursor:pointer;border:0;background:none;padding:0;font:inherit}
.card3d.flipped .card-in{transform:rotateY(180deg)}
.cb,.cf{position:absolute;inset:0;border-radius:10px;-webkit-backface-visibility:hidden;backface-visibility:hidden;display:grid;place-items:center;font-weight:700;text-align:center;padding:4px}
.cb{background:repeating-linear-gradient(45deg,#17203A,#17203A 8px,#22305A 8px,#22305A 16px);color:#F7C553;font-family:var(--display);font-size:1.7rem;border:2px solid var(--gold-fill)}
.cf{transform:rotateY(180deg);background:var(--surface2);color:var(--muted);border:2px solid var(--line);font-size:1rem}
.cf.win{background:var(--gold-fill);color:#2B1E00;border-color:var(--gold-fill);font-family:var(--display);font-size:1.35rem;font-weight:400}
.cf.tier{background:var(--tf);color:var(--tfo);border-color:var(--tf)}
.card3d small{font-size:.82rem;font-weight:700;text-align:center;word-break:break-all;line-height:1.2}
.pb{display:block;border-radius:12px}
.arrivals{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;width:100%;min-height:30px}
.arrivals span{background:var(--surface2);border-radius:999px;padding:3px 10px;font-size:.85rem;font-weight:700}
.arrivals span i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}
.st-tools{display:flex;gap:8px;margin-top:10px;width:100%}
.ladder .lb.win{fill:var(--gold)}
.mk-wheel{width:120px;height:120px;animation:g-spin 5s cubic-bezier(.15,.65,.1,1) infinite}
@keyframes g-spin{0%{transform:rotate(0)}55%,100%{transform:rotate(1150deg)}}

/* profile */
.av{width:28px;height:28px;border-radius:50%;object-fit:cover;flex:none;border:1.5px solid var(--line);background:var(--surface2);display:inline-block;vertical-align:middle}
.av.lg{width:56px;height:56px;border-width:2px;border-color:var(--gold-fill)}
.m-name .av{width:26px;height:26px}
.me-btn{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:.8rem;font-weight:700;padding:3px 12px 3px 3px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;min-height:32px;white-space:nowrap}
.hero .me-btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3);color:#fff}
.me-btn .av{width:24px;height:24px;border:0}
.me-btn .ph{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:rgba(127,127,127,.28)}
.me-btn .ph svg.i{width:16px;height:16px}
.pf-top{display:flex;align-items:center;gap:14px;margin:8px 0 14px}
.pf-top b{font-family:var(--display);font-weight:400;font-size:1.5rem;display:block;line-height:1.15}
.pf-top span{font-size:.85rem;color:var(--muted)}
.pf-ph{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);color:var(--muted);font-family:var(--display);font-size:2.2rem;border:3px solid var(--gold-fill);flex:none;overflow:hidden}
.pf-ph img{width:100%;height:100%;object-fit:cover}
.pf-acts{display:flex;flex-wrap:wrap;gap:8px}
.pick-list{list-style:none;margin:8px 0 0;padding:0;max-height:42vh;overflow:auto;border:1px solid var(--line);border-radius:12px}
.pick-list li+li{border-top:1px solid var(--line)}
.pick-list button{font:inherit;width:100%;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;background:var(--surface);border:0;color:var(--ink);cursor:pointer;font-weight:700;min-height:48px}
.pick-list button:disabled{color:var(--muted);cursor:not-allowed;font-weight:500}
.pick-list small{font-size:.78rem;color:var(--muted);font-weight:500}
.warn-box{background:var(--amber-soft);color:var(--amber);border-radius:12px;padding:12px 14px;font-size:.92rem;font-weight:600;margin:12px 0}
.uid{font-size:.75rem;color:var(--muted);word-break:break-all;margin:16px 0 0}
.admin-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.admin-row:first-of-type{border-top:0}
.admin-row .n{flex:1;font-weight:700}
.mem-link{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;font-weight:600;color:var(--green)}
.mem-link .av{width:24px;height:24px}
.cf{display:flex;flex-direction:column;align-items:center;justify-content:center}
.cf .cimg{width:64%;aspect-ratio:1/1;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.85);margin-bottom:6px}
.arrivals span img{width:16px;height:16px;border-radius:50%;object-fit:cover;margin-right:5px;vertical-align:-3px}
.cap-r img{width:30px;height:30px;border-radius:50%;object-fit:cover;flex:none}

/* my card, podium, deltas, search, collapse */
.my-card{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1.5px solid var(--gold-fill);border-radius:16px;padding:16px 14px 12px;margin:0 0 14px;position:relative;overflow:hidden}
.my-card.empty{display:flex;justify-content:space-between;align-items:center;gap:10px;border-style:dashed;border-color:var(--line);color:var(--muted);font-size:.92rem;padding:12px 14px}
.my-card.empty .btn{min-height:40px;padding:8px 14px;font-size:.9rem;flex:none}
.mc-label{position:absolute;top:0;left:0;font-size:.7rem;font-weight:800;background:var(--gold-fill);color:#2B1E00;padding:1px 9px;border-radius:0 0 8px 0}
.mc-av{width:54px;height:54px;border-radius:50%;overflow:hidden;background:var(--surface2);display:grid;place-items:center;font-family:var(--display);font-size:1.4rem;color:var(--muted);border:2px solid var(--gold-fill)}
.mc-av img{width:100%;height:100%;object-fit:cover}
.mc-mid{min-width:0}
.mc-top{display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.mc-top b{font-size:1.08rem}
.mc-sub{font-size:.85rem;color:var(--muted);margin-top:1px}
.mc-goal{font-size:.88rem;font-weight:700;color:var(--blue);margin-top:3px}
.mc-up{font-size:.85rem;font-weight:800;color:var(--green);margin-top:3px}
.mc-rank{text-align:right;white-space:nowrap}
.mc-rank b{font-family:var(--display);font-weight:400;font-size:2.1rem;line-height:1}
.mc-rank span{font-size:.85rem;font-weight:700;margin-left:2px}
.mc-rank small{display:block;font-size:.82rem;color:var(--muted);margin-top:2px}
@keyframes mc-glow{0%{box-shadow:0 0 0 0 rgba(244,185,43,.55)}100%{box-shadow:0 0 0 14px rgba(244,185,43,0)}}
.my-card.up{animation:mc-glow 1.2s ease-out 2}
.dlt{font-size:.72rem;font-weight:800;padding:1px 6px;border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums}
.dlt.up{color:var(--green);background:var(--green-soft)}
.dlt.down{color:var(--red);background:var(--red-soft)}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:8px;margin:0 0 14px;padding:16px 10px 0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.pd{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.pd.p1{--md:#E3A008}
.pd.p2{--md:#98A2B1}
.pd.p3{--md:#C27C3E}
.pd-av{width:54px;height:54px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:var(--surface2);font-family:var(--display);font-size:1.35rem;color:var(--muted);border:3px solid var(--md)}
.pd.p1 .pd-av{width:70px;height:70px;font-size:1.7rem}
.pd-av img{width:100%;height:100%;object-fit:cover}
.pd-n{font-weight:700;font-size:.95rem;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pd-s{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.pd-base{width:100%;border-radius:10px 10px 0 0;background:var(--md);display:grid;place-items:center;font-family:var(--display);color:#fff;font-size:1.5rem;margin-top:5px;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.pd.p1 .pd-base{height:66px}
.pd.p2 .pd-base{height:48px}
.pd.p3 .pd-base{height:34px}
.rsearch{position:relative;margin:0 0 12px}
.rsearch .in{padding-left:40px}
.rsearch svg.i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);width:20px;height:20px}
.grp-h.tg{padding:0}
.grp-tg{font:inherit;color:inherit;background:none;border:0;width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;cursor:pointer;text-align:left;font-weight:700;font-size:1.02rem}
.grp-tg .grp-r{display:inline-flex;align-items:center;gap:6px}
.grp-tg svg.i{width:18px;height:18px;transition:transform .2s}
.grp.collapsed .grp-tg svg.i{transform:rotate(-90deg)}
.grp.collapsed > :not(.grp-h){display:none}
.no-match{text-align:center;color:var(--muted);padding:20px 0}
/* motion */
@keyframes pg-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes sh-in{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes ov-in{from{opacity:0}to{opacity:1}}
.pg-enter{animation:pg-in .22s ease-out}
.overlay.ov-enter{animation:ov-in .18s ease-out}
.overlay.ov-enter .sheet{animation:sh-in .26s cubic-bezier(.2,.8,.2,1)}
.stage-ov{animation:ov-in .18s ease-out}
.stage{animation:sh-in .26s cubic-bezier(.2,.8,.2,1)}
.toast.t-enter{animation:pg-in .2s ease-out}
.btn,.tool,.pick,.rchip,.type,.tile,.nav button{transition:transform .12s ease}
.btn:active,.tool:active,.pick:active,.rchip:active,.type:active,.tile:active,.nav button:active{transform:scale(.97)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70}

/* tension: ready, countdown, sound, captions, cards, ladder, race */
.st-hr{display:flex;align-items:center;gap:6px;flex:none}
.snd{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.snd svg.i{width:20px;height:20px}
.snd[aria-pressed="false"]{color:var(--muted)}
.ready{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;padding:8px 0}
.ready-rule{font-size:1.05rem;font-weight:700;text-align:center;margin:0;word-break:keep-all}
.ready-ents{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-height:34vh;overflow:auto}
.re{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);border-radius:999px;padding:4px 10px 4px 4px;font-size:.88rem;font-weight:700}
.re img,.re i{width:24px;height:24px;border-radius:50%;object-fit:cover;display:grid;place-items:center;font-style:normal;color:#fff;font-size:.75rem;flex:none}
@keyframes go-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
.go-btn{max-width:320px;font-size:1.2rem;min-height:60px;animation:go-pulse 1.6s ease-in-out infinite}

async function pfLink(memberId) {

  b.set(FB.db.collection('links').doc(memberId), { uid, at:Date.now() });

  try { await b.commit(); UI.pfInfo = { kind:'ok', text:memOf(memberId).name + ' 닉네임과 연결됐어요. 이제 사진을 올려 보세요.' }; }

}

function pfPhoto(file) {

    const size = 160, c = document.createElement('canvas'); c.width = c.height = size;
    const side = Math.min(img.naturalWidth, img.naturalHeight), sx = (img.naturalWidth - side) / 2, sy = (img.naturalHeight - side) / 2;
    const cx = c.getContext('2d'); cx.fillStyle = '#ffffff'; cx.fillRect(0, 0, size, size); cx.drawImage(img, sx, sy, side, side, 0, 0, size, size);
    URL.revokeObjectURL(url);

    savePhoto(data);
  };

async function fbSave() {
  if (!FB || !dirty || mode !== 'fbadmin') return;
  clearTimeout(timer);
  status = 'saving'; paintStatus();
  const stamp = S.updated, payload = { data:JSON.stringify(S), updated:stamp, by:hostName() }, base = FB.base;
  FB.pending = stamp;
  try {
    await FB.db.runTransaction(async tx => {
      const cur = await tx.get(FB.ref);
      const cu = cur.exists ? (Number(cur.data().updated) || 0) : null;
      if (cur.exists && base !== null && cu !== base) { const err = new Error('conflict'); err.code = 'board-conflict'; throw err; }
      tx.set(FB.ref, payload);
    });
    FB.base = stamp;
    if (S.updated === stamp) { dirty = false; status = 'saved'; paintStatus(); } else schedule(800);
  } catch (e) {
    FB.pending = null;
    if (e && e.code === 'board-conflict') {
      try { const snap = await FB.ref.get(); dirty = false; FB.base = null; onRemote(snap); UI.msg = '다른 관리자가 먼저 저장해서 최신 내용으로 바꿨어요. 방금 바꾼 내용은 다시 해 주세요.'; render(); } catch (x) {}
      return;
    }
    if (e && e.code === 'permission-denied') { FB.admin = false; UI.msg = '관리자 권한이 없어서 저장하지 못했어요.'; dirty = false; applyRole(); return; }
    status = 'error'; UI.msg = '저장하지 못했어요. 인터넷 연결을 확인하고 위쪽의 지금 저장을 눌러 주세요.'; render();
  }
}

  else if (mode === 'shared') { status = 'pending'; schedule(); }

function focusedField() { const a = document.activeElement; return !!(a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT')); }
async function trySave(force) {
  if (!dirty || mode !== 'shared' || !A) return;
  if (!force) {
    if (UI.ladder || UI.wiz || UI.guide !== null || STAGE) return;
    if (focusedField() && waits < 8) { waits++; schedule(1500); return; }
  }

function handleErr(e) {
  const code = e && e.code;
  if (code === 'conflict') { status = 'conflict'; UI.msg = '다른 운영진이 먼저 저장해서 최신본으로 다시 불러와요.'; render(); return; }
  if (['not_writer','not_granted','consent_required','capability_disabled','capability_removed','not_declared'].includes(code)) { goRO(true); return; }
  if (code === 'rate_limited') { status = 'pending'; paintStatus(); schedule(15000); return; }
  if (code === 'too_large' || code === 'invalid_content' || code === 'transform_error') { status = 'error'; UI.msg = '기록이 너무 많아 저장하지 못했어요. 결과를 복사해 둔 뒤 새 시즌을 시작해 주세요.'; render(); return; }
  if (!retried) { retried = true; status = 'pending'; paintStatus(); schedule(1000 + Math.random() * 2000); return; }
  status = 'error'; UI.msg = '저장하지 못했어요. 위쪽의 지금 저장을 다시 눌러 주세요.'; render();
}

// ---------- scoring ----------
const typeOf = id => S.types.find(t => t.id === id);
const memOf = id => S.members.find(m => m.id === id);
const evOf = id => S.events.find(e => e.id === id);
const nameOf = id => { const m = memOf(id); return m ? m.name : '(삭제됨)'; };
const prioName = () => { const t = typeOf(S.priority); return t ? t.name : '우선 콘텐츠'; };
const eligibleFor = () => true;
const sortedEvents = () => S.events.filter(e => typeOf(e.type)).sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
const tierIdx = id => S.tiers.findIndex(t => t.id === id);
const tierName = id => { const t = S.tiers.find(x => x.id === id); return t ? t.name : '없음'; };
const tierCls = id => { const i = tierIdx(id); return i < 0 ? '' : 'tier tier-' + (i % 6); };
const seasonCounts = () => S.types.map(t => t.name + ' ' + S.events.filter(e => e.type === t.id).length + '회').join(', ');

function stats(skipDate) {
  const evs = sortedEvents().filter(e => !skipDate || e.date !== skipDate);
  return S.members.map(m => {
    const x = { m, pts:0, inN:0, exN:0, abN:0, prio:0, opp:0, rin:0, rate:null, hist:[] };
    for (const e of evs) {
      if (!eligibleFor(m, e.date)) continue;
      const t = typeOf(e.type), s = e.st[m.id] || 'ab';
      if (s === 'na') continue;
      let p = 0; const bn = [];
      if (s === 'in') {
        p = t.pts; x.inN++;
        if (t.id === S.priority) x.prio++;
        for (const b of t.bonuses) if ((e.bonus[b.id] || []).includes(m.id)) { p += b.pts; bn.push(b.name); }
      } else if (s === 'ex') { p = -t.exPen; x.exN++; }
      else { p = -t.pen; x.abN++; }
      x.pts += p;
      if (t.rate) {
        if (s === 'in') { x.opp++; x.rin++; }
        else if (s === 'ex') { if (S.demote.excused === 'count') x.opp++; }
        else x.opp++;
      }
      x.hist.push({ e, t, s, p, bn });
    }
    x.exact = x.opp ? x.rin * 100 / x.opp : null;
    x.rate = x.exact === null ? null : Math.floor(x.exact);
    x.below = x.exact !== null && x.exact < S.demote.rate;
    x.demoted = x.below && !S.demote.trial;
    x.reasons = [];
    if (S.reward.needNotice && !m.notice) x.reasons.push('공지방 미참여');
    if (S.reward.minRate > 0 && x.exact !== null && x.exact < S.reward.minRate) x.reasons.push('참여율 ' + S.reward.minRate + '% 미만');
    if (x.demoted) x.reasons.push('강등 대상');
    x.elig = !x.reasons.length;
    return x;
  });
}
function compute(skipDate) {
  const xs = stats(skipDate);
  const active = skipDate ? S.events.some(e => e.date !== skipDate) : S.events.length > 0;
  const cmp = (a, b) => b.pts - a.pts || b.prio - a.prio || a.abN - b.abN;
  xs.sort((a, b) => cmp(a, b) || a.m.name.localeCompare(b.m.name, 'ko'));
  xs.forEach((x, i) => { x.rank = (i > 0 && cmp(x, xs[i - 1]) === 0) ? xs[i - 1].rank : i + 1; });
  const bounds = []; let acc = 0;
  S.tiers.forEach(t => { acc += t.slots; bounds.push(acc); });
  const tierOf = p => { if (!active) return ''; for (let k = 0; k < bounds.length; k++) if (p < bounds[k]) return S.tiers[k].id; return ''; };
  const rows = [], pending = [];
  let p = 0, i = 0;
  while (i < xs.length) {
    let j = i;
    while (j + 1 < xs.length && cmp(xs[j + 1], xs[i]) === 0) j++;
    const grp = xs.slice(i, j + 1);
    let E = grp.filter(x => x.elig);
    const I = grp.filter(x => !x.elig);
    const labels = E.map((_, k) => tierOf(p + k));
    E.forEach(x => { x.tier = ''; x.drawn = false; });
    if (new Set(labels).size > 1) {
      const ids = E.map(x => x.m.id);
      const key = [grp[0].pts, grp[0].prio, grp[0].abN].join(',') + '|' + ids.slice().sort().join(',') + '|' + labels.join(',');
      const d = S.draws[key];
      if (d && Array.isArray(d.order) && d.order.length === ids.length && ids.every(id => d.order.includes(id))) {
        E = d.order.map(id => E.find(x => x.m.id === id));
        E.forEach((x, k) => { x.tier = labels[k]; x.drawn = true; });
      } else {
        E.forEach(x => { x.tier = 'pending'; });
        pending.push({ key, ids, labels, pts:grp[0].pts, members:E.slice() });
      }
    } else E.forEach((x, k) => { x.tier = labels[k] || ''; });
    I.forEach(x => { x.tier = ''; x.drawn = false; });
    p += E.length;
    rows.push(...E, ...I);
    i = j + 1;
  }
  return { rows, pending, active, xs };
}

function wizStart(typeId, date) {

function wizEdit(eid) {

    in:Object.keys(e.st).filter(k => e.st[k] === 'in'), ex:Object.keys(e.st).filter(k => e.st[k] === 'ex'), na:Object.keys(e.st).filter(k => e.st[k] === 'na'), naOpen:false, bonus:JSON.parse(JSON.stringify(e.bonus || {})) };

function wizClean(w) {
  const ids = new Set(wizElig(w).map(m => m.id));
  w.in = w.in.filter(id => ids.has(id));
  w.ex = w.ex.filter(id => ids.has(id) && !w.in.includes(id));
  w.na = (w.na || []).filter(id => ids.has(id) && !w.in.includes(id) && !w.ex.includes(id));
  const tt = typeOf(w.type), valid = new Set(tt ? tt.bonuses.map(b => b.id) : []), nb = {};
  Object.entries(w.bonus || {}).forEach(([k, v]) => { if (!valid.has(k)) return; const f = v.filter(id => w.in.includes(id)); if (f.length) nb[k] = f; });
  w.bonus = nb;
}
function wizSave() {
  const w = UI.wiz, t = typeOf(w.type); if (!t) return;
  wizClean(w);
  const st = {};
  w.in.forEach(id => { st[id] = 'in'; });
  w.ex.forEach(id => { st[id] = 'ex'; });
  w.na.forEach(id => { st[id] = 'na'; });
  const bonus = JSON.parse(JSON.stringify(w.bonus));
  if (w.eid && evOf(w.eid)) { const e = evOf(w.eid); e.type = w.type; e.date = w.date; e.st = st; e.bonus = bonus; }
  else S.events.push({ id:uid(), type:w.type, date:w.date, st, bonus });
  UI.msg = md(w.date) + ' ' + t.name + ' 기록을 저장했어요.';
  UI.wiz = null; UI.tab = 'rank'; UI.armed = null;
  changed();
  window.scrollTo(0, 0);
  if (mode === 'shared') schedule(800);
}

function confetti(el) {
  if (prefersReduced()) return;
  const cv = document.createElement('canvas'), ctx = cv.getContext && cv.getContext('2d');
  if (!ctx) return;
  const dpr = Math.min(2, window.devicePixelRatio || 1), W = window.innerWidth, H = window.innerHeight;
  cv.className = 'confetti'; cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px';
  document.body.appendChild(cv); ctx.scale(dpr, dpr);
  const rc = el && el.getBoundingClientRect ? el.getBoundingClientRect() : { left:W / 2 - 50, top:H / 3, width:100, height:0 };
  const ox = rc.left + rc.width / 2, oy = rc.top + Math.min(30, rc.height / 2);
  const cols = ['#F4B92B', '#3F8FD2', '#3BA776', '#C2507A', '#8E6BD1'];
  const ps = Array.from({ length:46 }, () => { const a = -Math.PI / 2 + (Math.random() - 0.5) * 1.7, v = 240 + Math.random() * 260; return { x:ox, y:oy, vx:Math.cos(a) * v, vy:Math.sin(a) * v, w:5 + Math.random() * 4, h:3 + Math.random() * 3, rot:Math.random() * 6, vr:(Math.random() - 0.5) * 10, c:cols[Math.floor(Math.random() * cols.length)] }; });
  let t0 = 0, last = 0;
  const dur = 1500;
  const tick = t => {
    if (!t0) { t0 = t; last = t; }
    const dt = Math.min(0.05, (t - last) / 1000); last = t;
    const alpha = Math.max(0, 1 - (t - t0) / dur);
    ctx.clearRect(0, 0, W, H);
    ps.forEach(q => { q.vy += 900 * dt; q.vx *= 0.99; q.x += q.vx * dt; q.y += q.vy * dt; q.rot += q.vr * dt; ctx.save(); ctx.globalAlpha = alpha; ctx.translate(q.x, q.y); ctx.rotate(q.rot); ctx.fillStyle = q.c; ctx.fillRect(-q.w / 2, -q.h / 2, q.w, q.h); ctx.restore(); });
    if (t - t0 < dur) requestAnimationFrame(tick); else cv.remove();
  };
  requestAnimationFrame(tick);
}

const SFX = (() => {
  let ctx = null, on = true, last = 0;
  try { on = localStorage.getItem('guild-scoreboard-sound') !== 'off'; } catch (e) {}
  const ac = () => { try { if (!ctx) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; ctx = new C(); } if (ctx.state === 'suspended') ctx.resume(); return ctx; } catch (e) { return null; } };

  return {
    unlock: () => { ac(); },
    isOn: () => on,
    toggle: () => { on = !on; try { localStorage.setItem('guild-scoreboard-sound', on ? 'on' : 'off'); } catch (e) {} if (on) { ac(); tone(880, 0.08, { vol:0.04 }); } return on; },

})();

    case 'tierUp': case 'tierDown': {
      const i = tierIdx(id), j = act === 'tierUp' ? i - 1 : i + 1;
      if (i < 0 || j < 0 || j >= S.tiers.length) return;
      const tmp = S.tiers[i]; S.tiers[i] = S.tiers[j]; S.tiers[j] = tmp; changed(); break;
    }
    case 'guideOpen': UI.guide = 0; UI.sheet = null; render(); break;
    case 'guideNext': if (UI.guide === null) return; if (UI.guide >= guideSteps().length - 1) closeGuide(); else { UI.guide++; render(); } break;
    case 'guidePrev': if (UI.guide > 0) { UI.guide--; render(); } break;
    case 'guideGo': UI.guide = clampInt(b.dataset.v, 0, guideSteps().length - 1, 0); render(); break;
    case 'guideClose': closeGuide(); break;
  }
});
app.addEventListener('change', e => {
  if (e.target.id === 'pfFile') { pfPhoto(e.target.files && e.target.files[0]); e.target.value = ''; return; }
  if (e.target.id === 'importFile') { if (mode !== 'ro') importData(e.target); return; }
  if (e.target.dataset && e.target.dataset.af) { if (UI.af) UI.af[e.target.dataset.af] = e.target.value; return; }
  if (e.target.id === 'wDate') { if (isDate(e.target.value)) UI.wdate = e.target.value; return; }
  if (e.target.id === 'wzDate') { if (UI.wiz && isDate(e.target.value)) { UI.wiz.date = e.target.value; wizClean(UI.wiz); render(); } return; }
  const el = e.target.closest('[data-f]');
  if (!el || mode === 'ro') return;
  const f = el.dataset.f, id = el.dataset.id, v = el.value;
  if (f === 'rOfficial') { UI.rnd.official = el.checked; render(); if (el.checked) UI.focus = 'rTitle'; return; }
  const t = id ? typeOf(id) : null, m = id ? memOf(id) : null;
  switch (f) {
    case 'title': S.title = v.trim().slice(0, 40) || '<Z3RO> No Mercy'; el.value = S.title; break;
    case 'tName': if (!t) return; t.name = v.trim().slice(0, 30) || '이름 없음'; el.value = t.name; break;
    case 'tPts': if (!t) return; t.pts = clampInt(v, -9999, 9999, t.pts); el.value = t.pts; break;
    case 'tPen': if (!t) return; t.pen = clampInt(Math.abs(parseInt(v, 10)), 0, 9999, t.pen); el.value = t.pen; break;
    case 'tExPen': if (!t) return; t.exPen = clampInt(Math.abs(parseInt(v, 10)), 0, 9999, t.exPen); el.value = t.exPen; break;
    case 'bName': { const bo = t && t.bonuses.find(x => x.id === el.dataset.b); if (!bo) return; bo.name = v.trim().slice(0, 20) || '보너스'; el.value = bo.name; break; }
    case 'bPts': { const bo = t && t.bonuses.find(x => x.id === el.dataset.b); if (!bo) return; bo.pts = clampInt(v, 0, 9999, bo.pts); el.value = bo.pts; break; }
    case 'tRate': if (!t) return; t.rate = el.checked; break;
    case 'priority': if (typeOf(v)) S.priority = v; break;
    case 'tierName': { const tr = S.tiers.find(x => x.id === id); if (!tr) return; tr.name = v.trim().slice(0, 12) || '등급'; el.value = tr.name; break; }
    case 'tierSlots': { const tr = S.tiers.find(x => x.id === id); if (!tr) return; tr.slots = clampInt(v, 0, 999, tr.slots); el.value = tr.slots; break; }
    case 'rMin': S.reward.minRate = clampInt(v, 0, 100, S.reward.minRate); el.value = S.reward.minRate; break;
    case 'rNotice': S.reward.needNotice = el.checked; break;
    case 'dRate': S.demote.rate = clampInt(v, 0, 100, S.demote.rate); el.value = S.demote.rate; break;
    case 'dExcused': S.demote.excused = v === 'count' ? 'count' : 'skip'; break;
    case 'dTrial': S.demote.trial = el.checked; break;
    case 'memName': if (!m) return; { const nv = v.trim().slice(0, 30); if (nv) m.name = nv; el.value = m.name; } break;
    case 'memNotice': if (!m) return; m.notice = el.checked; break;
    default: return;
  }
  changed(false);
});
app.addEventListener('input', e => { if (e.target.id === 'rq') { UI.rq = e.target.value; const g = document.getElementById('rankGroups'); if (g) { const C = compute(); RD = rankDeltas(C); g.innerHTML = groupsHTML(C, mode === 'ro'); } return; } if (e.target.id === 'pfSearch') { UI.pfq = e.target.value; const ul = document.querySelector('.pick-list'); if (ul) ul.outerHTML = pickListHTML(); return; } if (e.target.id === 'rTitle') UI.rnd.title = e.target.value; if (e.target.id === 'rAddIn') UI.rnd.draft = e.target.value; if (e.target.id === 'addNames') UI.draft = e.target.value; if (e.target.dataset && e.target.dataset.af && UI.af) UI.af[e.target.dataset.af] = e.target.value; });
app.addEventListener('focusin', e => { if (e.target.id === 'copyBox') e.target.select(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.target.id === 'lgPw' || e.target.id === 'lgEmail')) { e.preventDefault(); doLogin(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.id === 'pfFileLbl') { e.preventDefault(); const f = document.getElementById('pfFile'); if (f) f.click(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.id === 'importLbl') { e.preventDefault(); const f = document.getElementById('importFile'); if (f) f.click(); return; }
  if (e.key === 'Enter' && e.target.id === 'rAddIn') { e.preventDefault(); rndAdd(); return; }
  if (e.key === 'Escape') {
    if (STAGE) { closeStage(); return; }
    if (UI.guide !== null) { closeGuide(); return; }
    if (UI.sheet === 'noticePop') { closeNoticePop(); return; }
    if (UI.copyText != null) { UI.copyText = null; render(); }
    else if (UI.ladder) { UI.ladder = null; render(); }
    else if (UI.sheet) { UI.sheet = null; render(); }
  }
});
window.addEventListener('beforeunload', e => { if (dirty && mode === 'shared') stashUI(); if (dirty && mode === 'fbadmin') { fbSave(); e.preventDefault(); e.returnValue = ''; } });

render();
})();
</script>
</body>
